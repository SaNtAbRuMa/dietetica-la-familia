<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fondo circular negro con borde verde natural -->
  <circle cx="200" cy="200" r="185" fill="#0A0A0A" stroke="#5EA31B" stroke-width="22" />
  
  <!-- Texto superior: DIETÉTICA HERBORISTERÍA -->
  <text 
    x="200" 
    y="142" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="19" 
    font-weight="800" 
    letter-spacing="2.5"
  >
    DIETÉTICA HERBORISTERÍA
  </text>
  
  <!-- Texto central: LA FAMILIA -->
  <text 
    x="200" 
    y="228" 
    text-anchor="middle" 
    fill="#5EA31B" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Oswald', 'Arial Black', sans-serif" 
    font-size="68" 
    font-weight="900" 
    letter-spacing="1" 
    style="transform: scaleY(1.1); transform-origin: 200px 210px;"
  >
    LA FAMILIA
  </text>
  
  <!-- Texto inferior: REPOSTERÍA COTILLÓN -->
  <text 
    x="200" 
    y="282" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="19" 
    font-weight="800" 
    letter-spacing="2.5"
  >
    REPOSTERÍA COTILLÓN
  </text>
</svg>
